name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ui/clean-slate-rebuild

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check server
        run: node --check server.mjs

      - name: Syntax check clean UI bootstrap
        run: node --check public/app.js

      - name: Syntax check deployment tooling
        run: |
          node --check lib/deployment-provenance.mjs
          node --check scripts/smoke-deployment.mjs

      - name: Run backend/core tests
        run: npm test

      - name: Verify ledger invariants
        run: npm run verify
