name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - automation/stake-tier-model

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check server
        run: node --check server.mjs

      - name: Syntax check browser modules
        run: |
          node --check public/app.js
          node --check public/blackjack-v2.js
          node --check public/blackjack-session.js
          node --check public/game-stability.js
          node --check public/instant-idempotency.js
          node --check public/blackjack-idempotency.js
          node --check public/baccarat-trace.js
          node --check public/baccarat-chip-motion.js
          node --check public/roulette-trace.js
          node --check public/roulette-chip-motion.js
          node --check public/sicbo-trace.js
          node --check public/sicbo-chip-motion.js
          node --check public/runtime-provenance.js
          node --check public/vault-record-room.js
          node --check public/casino-audio.js
          node --check public/casino-chip-motion.js
          node --check public/vegas-ui-v2.js
          node --check public/sw.js

      - name: Syntax check deployment tooling
        run: |
          node --check lib/deployment-provenance.mjs
          node --check scripts/smoke-deployment.mjs

      - name: Run tests
        run: npm test

      - name: Verify ledger invariants
        run: npm run verify
