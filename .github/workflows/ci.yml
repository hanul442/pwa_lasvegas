name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - automation/stake-tier-model

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Syntax check server
        run: node --check server.mjs

      - name: Run tests
        run: npm test

      - name: Verify ledger invariants
        run: npm run verify
