<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">VEGAS gold wordmark</title>
  <desc id="desc">Premium geometric VEGAS wordmark in metallic gold on black with a star glint inside the A.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e5d18"/>
      <stop offset="0.22" stop-color="#f8dea0"/>
      <stop offset="0.48" stop-color="#c88f34"/>
      <stop offset="0.72" stop-color="#fff0bd"/>
      <stop offset="1" stop-color="#9a641b"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5cf"/>
      <stop offset="0.45" stop-color="#eec977"/>
      <stop offset="1" stop-color="#9a621c"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95  0 0.75 0 0 0.55  0 0 0.35 0 0.12  0 0 0 0.72 0" result="warm"/>
      <feMerge><feMergeNode in="warm"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="#020202"/>
  <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter" filter="url(#softGlow)">
    <!-- V -->
    <path d="M218 391 L326 575 L438 391"/>

    <!-- E -->
    <path d="M490 392 H638 M490 482 H592 M490 570 H638 M490 392 V570"/>

    <!-- G -->
    <path d="M854 429 C829 401 795 390 759 390 C692 390 644 431 644 486 C644 545 688 582 755 582 C801 582 833 566 853 542"/>
    <path d="M778 489 H861 V551"/>

    <!-- A -->
    <path d="M900 575 L997 391 L1098 575"/>

    <!-- S -->
    <path d="M1308 407 C1279 392 1237 389 1204 395 C1164 402 1140 424 1140 451 C1140 481 1170 492 1221 502 C1277 513 1309 527 1309 553 C1309 582 1270 592 1224 592 C1185 592 1153 584 1128 568"/>
  </g>

  <!-- metallic highlight passes -->
  <g fill="none" stroke="url(#goldBright)" stroke-width="5" opacity="0.85">
    <path d="M221 394 L326 570"/>
    <path d="M494 396 H633"/>
    <path d="M664 443 C687 405 725 393 760 393"/>
    <path d="M905 566 L997 397"/>
    <path d="M1150 430 C1181 397 1257 393 1300 409"/>
  </g>

  <!-- star glint in A -->
  <g transform="translate(997 505)" fill="#fff0b5" filter="url(#starGlow)">
    <path d="M0 -42 C3 -13 8 -5 35 0 C8 5 3 13 0 42 C-3 13 -8 5 -35 0 C-8 -5 -3 -13 0 -42Z"/>
    <circle r="4" fill="#fff9e8"/>
  </g>
</svg>
