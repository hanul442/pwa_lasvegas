<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="현금 가치가 없는 가상 칩으로 친구들과 즐기는 소셜 카지노">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VEGAS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="table.css">
  <link rel="stylesheet" href="hwatu.css">
  <link rel="stylesheet" href="lounge.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-nav="lobby" aria-label="VEGAS 로비로 이동"><img src="logo.svg" alt="VEGAS" width="104" height="22"></button>
      <div class="topbar-right">
        <button class="sound-toggle" type="button" data-sound aria-label="소리 끄기" aria-pressed="true"><span aria-hidden="true">♪</span></button>
        <button class="sound-toggle settings-toggle" type="button" data-nav="settings" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
        <button class="wallet" type="button" data-nav="profile" aria-label="내 가상 칩, 프로필 보기"><strong data-wallet>—</strong><small>CH</small></button>
      </div>
    </header>

    <main id="app" class="surface-stack">
      <section class="surface is-active" data-surface="lobby" aria-labelledby="lobby-title">
        <div class="lobby-split">
          <button class="vignette" type="button" data-vignette data-game="blackjack" aria-label="블랙잭 테이블로 가기">
            <span class="vignette-hand" data-vignette-hand></span>
            <span class="vignette-chips" data-vignette-chips></span>
            <span class="vignette-caption"><b>Blackjack</b><span>지금 바로 앉을 수 있어요</span></span>
          </button>
          <div>
            <div class="hero">
              <h1 id="lobby-title">오늘 밤은 어느 테이블에 앉을까요?</h1>
              <p class="lede">현금 가치가 없는 가상 칩으로 즐기는 소셜 카지노예요. 혼자서, 혹은 친구와 함께.</p>
              <div class="hero-actions" data-recharge-slot></div>
            </div>
            <ul class="game-menu" data-game-grid></ul>
          </div>
        </div>
        <div class="lounge" data-lounge aria-label="오늘의 라운지"></div>
      </section>

      <section class="surface" data-surface="games" aria-labelledby="games-title">
        <h1 id="games-title">게임</h1>
        <p class="lede">게임을 고른 뒤 테이블 한도를 선택하세요. CH는 구매·환전·출금할 수 없으며 현실 화폐 가치가 없습니다.</p>
        <ul class="game-menu" data-floor-list></ul>
      </section>

      <section class="surface" data-surface="ranking" aria-labelledby="ranking-title">
        <h1 id="ranking-title">랭킹</h1>
        <div class="segmented segmented--two" role="radiogroup" aria-label="랭킹 기간" data-rank-period></div>
        <div class="season-head" data-season-head></div>
        <div class="tabs" role="tablist" data-rank-tabs></div>
        <ol class="rank-list" data-rank-list></ol>
      </section>

      <section class="surface" data-surface="profile" aria-labelledby="profile-title">
        <h1 id="profile-title">프로필</h1>
        <div data-profile></div>
      </section>

      <section class="surface" data-surface="settings" aria-labelledby="settings-title">
        <h1 id="settings-title">설정</h1>
        <p class="lede">이 기기에만 저장돼요. 칩과 기록에는 영향을 주지 않아요.</p>
        <div class="settings-body" data-settings></div>
      </section>

      <section class="surface" data-surface="tiers" aria-labelledby="tiers-title">
        <button class="back-button" type="button" data-tier-back>게임 목록</button>
        <h1 id="tiers-title">테이블</h1>
        <p class="lede" id="tier-game-name"></p>
        <div class="tier-grid" data-tier-grid role="list"></div>
        <p class="virtual-note">CH는 오직 게임 내 가상 포인트이며 현실 화폐 가치가 없습니다.</p>
      </section>

      <section class="surface game-surface" data-surface="table" aria-label="게임 테이블">
        <div data-table-mount></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-item is-active" type="button" data-nav="lobby">로비</button>
      <button class="nav-item" type="button" data-nav="games">게임</button>
      <button class="nav-item" type="button" data-nav="ranking">랭킹</button>
      <button class="nav-item" type="button" data-nav="profile">프로필</button>
    </nav>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
